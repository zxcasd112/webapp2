services:
  - type: web
    name: taskmaster-fantasy
    env: node
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskmaster-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REACT_APP_API_URL
        value: https://taskmaster-fantasy.onrender.com

databases:
  - name: taskmaster-db
    plan: free
    region: oregon